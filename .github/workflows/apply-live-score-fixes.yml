name: Apply live score fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply-live-score-fixes.py

      - name: Verify build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Commit patch and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/app/api/matches/[matchId]/route.ts src/lib/match-setup.ts src/lib/scoring.ts
          git commit -m "fix: show targets and complete live matches"
          git rm scripts/apply-live-score-fixes.py .github/workflows/apply-live-score-fixes.yml
          git commit -m "chore: remove live score patch runner"
          git push
