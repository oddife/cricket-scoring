name: Patch live dismissal formatting

on:
  push:
    branches:
      - wicket-dismissal-2026-08-13

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wicket-dismissal-2026-08-13
          fetch-depth: 1

      - name: Patch live scorecard and innings API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/app/page.tsx')
          text = page.read_text()

          old = 'wicket: { type: string; dismissedPlayerId: string; bowlerId: string | null } | null;'
          new = 'wicket: { type: string; dismissedPlayerId: string; bowlerId: string | null; fielderId: string | null } | null;'
          if old not in text:
              raise SystemExit('Live wicket type marker not found')
          text = text.replace(old, new, 1)

          old = '''    const deliveryLabel = (delivery: LiveDeliveryView) => {
      if (delivery.isWicket) return "W";
      if (delivery.extraType === "WIDE") return `Wd${delivery.runsExtra || 1}`;
      if (delivery.extraType === "NO_BALL") return `Nb${delivery.runsExtra || 1}`;
      if (delivery.extraType === "BYE") return `B${delivery.runsExtra || 1}`;
      if (delivery.extraType === "LEG_BYE") return `Lb${delivery.runsExtra || 1}`;
      return String(delivery.runsTotal);
    };'''
          new = '''    const deliveryLabel = (delivery: LiveDeliveryView) => {
      if (delivery.isWicket) return "W";
      if (delivery.extraType === "WIDE") return `Wd${delivery.runsExtra || 1}`;
      if (delivery.extraType === "NO_BALL") return `Nb${delivery.runsExtra || 1}`;
      if (delivery.extraType === "BYE") return `B${delivery.runsExtra || 1}`;
      if (delivery.extraType === "LEG_BYE") return `Lb${delivery.runsExtra || 1}`;
      return String(delivery.runsTotal);
    };

    const liveDismissalText = (delivery: LiveDeliveryView) => {
      if (!delivery.wicket) return "";
      const bowler = delivery.wicket.bowlerId
        ? liveBowlingPlayers.find((player) => player.id === delivery.wicket!.bowlerId)?.name ?? "Bowler"
        : "Bowler";
      const fielder = delivery.wicket.fielderId
        ? liveBowlingPlayers.find((player) => player.id === delivery.wicket!.fielderId)?.name ?? ""
        : "";
      switch (delivery.wicket.type) {
        case "BOWLED": return `b ${bowler}`;
        case "CAUGHT": return fielder ? `c ${fielder}   b ${bowler}` : `c b ${bowler}`;
        case "LBW": return `lbw b ${bowler}`;
        case "RUN_OUT": return fielder ? `run out (${fielder})` : "run out";
        case "STUMPED": return fielder ? `st ${fielder}   b ${bowler}` : `st b ${bowler}`;
        case "HIT_WICKET": return `hit wicket b ${bowler}`;
        case "RETIRED_OUT": return "retired out";
        case "RETIRED_HURT": return "retired hurt";
        case "OVER_FENCE": return "over fence";
        default: return "out";
      }
    };'''
          if old not in text:
              raise SystemExit('Live delivery label marker not found')
          text = text.replace(old, new, 1)

          old = '''      return {
        player,
        runs,
        balls: balls.length,
        fours,
        sixes,
        strikeRate: balls.length
          ? ((runs / balls.length) * 100).toFixed(2)
          : "0.00",
        dismissed: dismissedIds.has(player.id),
      };'''
          new = '''      const dismissalDelivery = liveDeliveries.find(
        (delivery) =>
          delivery.wicket?.dismissedPlayerId === player.id,
      );
      return {
        player,
        runs,
        balls: balls.length,
        fours,
        sixes,
        strikeRate: balls.length
          ? ((runs / balls.length) * 100).toFixed(2)
          : "0.00",
        dismissed: dismissedIds.has(player.id),
        dismissal: dismissalDelivery ? liveDismissalText(dismissalDelivery) : "",
      };'''
          if old not in text:
              raise SystemExit('Live batting stats marker not found')
          text = text.replace(old, new, 1)

          old = '<span className="truncate font-bold">{stat.player.name}{stat.player.id === liveStrikerId ? " *" : ""}{stat.dismissed ? " OUT" : ""}</span>'
          new = '<div className="min-w-0"><span className="truncate font-bold">{stat.player.name}{stat.player.id === liveStrikerId ? " *" : ""}</span><p className="whitespace-pre text-[9px] text-slate-400">{stat.dismissed ? stat.dismissal : "NOT OUT"}</p></div>'
          if old not in text:
              raise SystemExit('Live batter display marker not found')
          text = text.replace(old, new, 1)

          page.write_text(text)

          route = Path('src/app/api/innings/[inningsId]/route.ts')
          text = route.read_text()
          old = '''              wicket: {
              select: {
                type: true,
                dismissedPlayerId: true,
                bowlerId: true,
              },
            },'''
          new = '''            wicket: {
              select: {
                type: true,
                dismissedPlayerId: true,
                bowlerId: true,
                fielderId: true,
              },
            },'''
          if old not in text:
              raise SystemExit('Innings API wicket select marker not found')
          text = text.replace(old, new, 1)
          route.write_text(text)
          PY

      - name: Validate
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm test -- --run

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx 'src/app/api/innings/[inningsId]/route.ts'
          git rm .github/workflows/patch-live-dismissal-format.yml
          git commit -m "fix: show dismissal notation in live scorecard"
          git push origin wicket-dismissal-2026-08-13
