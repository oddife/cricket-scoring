name: Fix existing player modal

on:
  push:
    branches:
      - fix/team-player-roster-removal

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'oddife'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix existing player loading and modal header
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/page.tsx')
          text = path.read_text()

          old_state = '''  async function loadTeamPlayers(teamId: string) {
'''
          new_state = '''  async function loadAvailablePlayers() {
    try {
      setLoadingAvailablePlayers(true);
      setError("");

      const response = await fetch("/api/players", {
        cache: "no-store",
      });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data?.error || "Failed to load existing players.",
        );
      }

      setAvailablePlayers(Array.isArray(data) ? data : []);
    } catch (err) {
      console.error(err);
      setAvailablePlayers([]);
      setError(
        err instanceof Error
          ? err.message
          : "Failed to load existing players.",
      );
    } finally {
      setLoadingAvailablePlayers(false);
    }
  }

  async function loadTeamPlayers(teamId: string) {
'''
          if old_state not in text:
              raise SystemExit('loadTeamPlayers marker not found')
          text = text.replace(old_state, new_state, 1)

          old_open = '''    setError("");
    setShowAddPlayer(true);
    void loadGlobalTeams();
  }

  async function addExistingPlayerToTeam() {
'''
          new_open = '''    setError("");
    setShowAddPlayer(true);
    void loadAvailablePlayers();
  }

  async function addExistingPlayerToTeam() {
'''
          if old_open not in text:
              raise SystemExit('openAddPlayerModal block not found')
          text = text.replace(old_open, new_open, 1)

          old_options = '''    const availableExistingPlayers = Array.from(
      new Map(
        globalTeams
          .flatMap((team) => team.players ?? [])
          .map((player) => [player.id, player]),
      ).values(),
    ).filter((player) => !currentTeamPlayerIds.has(player.id));
'''
          new_options = '''    const availableExistingPlayers = availablePlayers.filter(
      (player) => !currentTeamPlayerIds.has(player.id),
    );
'''
          if old_options not in text:
              raise SystemExit('existing player options block not found')
          text = text.replace(old_options, new_options, 1)

          old_header = '''            <div className="mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-500/10 text-2xl">PLAYER</div>
'''
          if old_header not in text:
              raise SystemExit('PLAYER modal header not found')
          text = text.replace(old_header, '', 1)

          old_tab = '''<button type="button" onClick={() => { setAddPlayerMode("EXISTING"); setSelectedExistingPlayerId(""); setError(""); void loadGlobalTeams(); }}'''
          new_tab = '''<button type="button" onClick={() => { setAddPlayerMode("EXISTING"); setSelectedExistingPlayerId(""); setError(""); void loadAvailablePlayers(); }}'''
          if old_tab not in text:
              raise SystemExit('existing player tab block not found')
          text = text.replace(old_tab, new_tab, 1)

          old_select = '''disabled={loadingGlobalTeams || availableExistingPlayers.length === 0}'''
          new_select = '''disabled={loadingAvailablePlayers || availableExistingPlayers.length === 0}'''
          if old_select not in text:
              raise SystemExit('existing player select disabled block not found')
          text = text.replace(old_select, new_select, 1)

          old_option = '''{loadingGlobalTeams ? "Loading players..." : availableExistingPlayers.length === 0 ? "No existing players available" : "Select a player"}'''
          new_option = '''{loadingAvailablePlayers ? "Loading players..." : availableExistingPlayers.length === 0 ? "No existing players available" : "Select a player"}'''
          if old_option not in text:
              raise SystemExit('existing player loading text block not found')
          text = text.replace(old_option, new_option, 1)

          path.write_text(text)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: load all global players in add player modal"
          git push
