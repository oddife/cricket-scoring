name: Apply innings transition and sidebar tabs fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair patch script
        run: python3 scripts/repair-v2.py
      - name: Apply source patch
        run: python3 scripts/apply-innings-tabs-v2.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx scripts/apply-innings-tabs-v2.py scripts/repair-v2.py .github/workflows/apply-innings-tabs-fix.yml scripts/fix-innings-tabs.js scripts/repair-innings-patch-script.js scripts/run-innings-tabs-patch.txt
          git rm scripts/apply-innings-tabs-v2.py scripts/repair-v2.py .github/workflows/apply-innings-tabs-fix.yml scripts/fix-innings-tabs.js scripts/repair-innings-patch-script.js scripts/run-innings-tabs-patch.txt
          git commit -m "fix: transition innings and enable live sidebar tabs"
          git push
