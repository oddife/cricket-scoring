name: Apply innings transition and sidebar tabs fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair patch script
        run: node scripts/repair-innings-patch-script.js
      - name: Apply source patch
        run: node scripts/fix-innings-tabs.js
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx scripts/fix-innings-tabs.js scripts/repair-innings-patch-script.js .github/workflows/apply-innings-tabs-fix.yml scripts/run-innings-tabs-patch.txt
          git rm scripts/fix-innings-tabs.js scripts/repair-innings-patch-script.js .github/workflows/apply-innings-tabs-fix.yml scripts/run-innings-tabs-patch.txt
          git commit -m "fix: transition innings and enable live sidebar tabs"
          git push
