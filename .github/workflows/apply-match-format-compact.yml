name: Apply compact match format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact Match Format section
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/app/page.tsx')
          text = path.read_text(encoding='utf-8')

          # Only replace the Match Format + status block in the Previous Match scorecard.
          pattern = re.compile(
              r'''(?P<start>\s*<div className="mt-4 grid gap-5 md:grid-cols-\[0\.9fr_1\.1fr\]">\s*<section>\s*<h3 className="text-sm font-black uppercase tracking-wide text-slate-500">Match Format</h3>).*?(?P<end>\s*</section>\s*</div>\s*\n\s*<div className={`mt-4 rounded-xl px-3 py-2\.5 text-sm font-bold )''',
              re.S,
          )

          replacement = r'''\n                  <div className="mt-4 grid gap-3 md:grid-cols-2">
                    <section>
                      <h3 className="text-sm font-black uppercase tracking-wide text-slate-500">Match Format</h3>
                      <dl className="mt-2 grid grid-cols-[1fr_auto] gap-x-6 gap-y-2 text-sm sm:grid-cols-2 sm:gap-x-8">
                        <div className="flex justify-between gap-3"><dt>Overs per Innings</dt><dd className="font-bold">{match.oversPerInnings}</dd></div>
                        <div className="flex justify-between gap-3"><dt>Innings</dt><dd className="font-bold">{match.inningsPerMatch}</dd></div>
                      </dl>
                    </section>

                    <section>
                      <h3 className="sr-only">Match Details</h3>
                      <dl className="mt-5 grid grid-cols-[auto_1fr] gap-x-4 gap-y-2 text-sm sm:mt-5 sm:grid-cols-[auto_1fr]">
                        <dt>Toss</dt><dd className="text-right font-bold">{tossText}</dd>
                        <dt>Bowling</dt><dd className="text-right font-bold">{bowlingText}</dd>
                      </dl>
                    </section>
                  </div>

                  <div className={`mt-3 flex flex-col gap-2 rounded-xl px-3 py-2.5 text-sm font-bold sm:flex-row sm:items-center sm:justify-between ${matchStatus === "COMPLETED" ? "bg-slate-100 text-slate-700" : "bg-emerald-50 text-emerald-700"}`}>
                    <div className="flex items-center gap-3 whitespace-nowrap">
                      <span>{matchStatus === "COMPLETED" ? "✓ COMPLETED" : "● LIVE"}</span>
                      <span>{resultText}</span>
                    </div>
                    {target != null && (
                      <div className="text-xs font-semibold text-slate-700 sm:text-right">
                        Target for <b>{targetTeam}</b> (batting last) in <b>inning {match.inningsPerMatch}</b>: <b className="text-emerald-700">{target} runs</b>
                      </div>
                    )}
                  </div>

                  <div className="mt-5 space-y-5">
'''

          # The existing code has the status block immediately after the two-column section.
          # Replace from Match Format heading through the status block, leaving all innings details below intact.
          start = text.find('<div className="mt-4 grid gap-5 md:grid-cols-[0.9fr_1.1fr]">')
          if start < 0:
              raise SystemExit('Match Format container not found')
          marker = '<div className="mt-5 space-y-5">'
          end = text.find(marker, start)
          if end < 0:
              raise SystemExit('Detailed innings marker not found')

          block = text[start:end]
          if 'Match Format' not in block or 'bg-emerald-50' not in block:
              raise SystemExit('Unexpected scorecard block; refusing to modify')

          # Build the compact block directly from the known scorecard variables.
          text = text[:start] + replacement + text[end + len(marker):]
          path.write_text(text, encoding='utf-8')
          print('Applied compact Match Format/status section only')
      - name: Verify production build
        run: npm ci && npx prisma generate && npm run build
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: compact scorecard match format section"
          git rm .github/workflows/apply-match-format-compact.yml
          git commit -m "chore: remove temporary compact scorecard workflow"
          git push
