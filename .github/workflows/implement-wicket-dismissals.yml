name: Implement wicket dismissal system

on:
  push:
    branches:
      - wicket-dismissal-2026-08-13

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch wicket UI and validation
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/page.tsx')
          text = page.read_text(encoding='utf-8')

          replacements = []

          replacements.append((
              '  const [wicketType, setWicketType] =\n    useState("BOWLED");',
              '  const [wicketType, setWicketType] =\n    useState("BOWLED");\n  const [wicketFielderId, setWicketFielderId] = useState("");'
          ))

          replacements.append((
              '    setReplacementPlayerId("");\n    setWicketType(extraType ? "RUN_OUT" : "BOWLED");',
              '    setReplacementPlayerId("");\n    setWicketFielderId("");\n    setWicketType(extraType ? "RUN_OUT" : "BOWLED");'
          ))

          replacements.append((
              '    replacementPlayerId?: string;\n  }) {',
              '    replacementPlayerId?: string;\n    fielderId?: string;\n  }) {'
          ))

          replacements.append((
              '            replacementPlayerId: typeof body.replacementPlayerId === "string" ? body.replacementPlayerId : undefined,\n            fielderId: typeof body.fielderId === "string" ? body.fielderId : undefined,',
              '            replacementPlayerId: typeof body.replacementPlayerId === "string" ? body.replacementPlayerId : undefined,\n            fielderId: typeof body.fielderId === "string" ? body.fielderId : undefined,'
          ))

          # The previous replacement is intentionally a no-op if the API call is already correct.
          replacements.append((
              '    const nextBatsmen = liveBattingPlayers.filter(\n      (player) =>\n        !activeBatters.has(player.id) &&\n        !dismissedIds.has(player.id),\n    );',
              '    const nextBatsmen = liveBattingPlayers.filter(\n      (player) =>\n        !activeBatters.has(player.id) &&\n        !dismissedIds.has(player.id),\n    );\n\n    const liveWicketKeeperId =\n      liveBowlingTeamId === teamAId ? wicketKeeperA :\n      liveBowlingTeamId === teamBId ? wicketKeeperB : "";\n    const wicketFielderOptions =\n      wicketType === "STUMPED"\n        ? liveBowlingPlayers.filter((player) => player.id === liveWicketKeeperId)\n        : liveBowlingPlayers;'
          ))

          replacements.append((
              '<option value="HIT_WICKET" className="bg-slate-950 text-white">Hit Wicket</option><option value="OVER_FENCE" className="bg-slate-950 text-white">Over Fence</option></select></div>',
              '<option value="HIT_WICKET" className="bg-slate-950 text-white">Hit Wicket</option></select></div>'
          ))

          replacements.append((
              'setReplacementPlayerId(""); }} className="h-12 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 text-white [color-scheme:dark] [color-scheme:dark]">',
              'setReplacementPlayerId(""); setWicketFielderId(value === "STUMPED" ? liveWicketKeeperId : ""); }} className="h-12 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 text-white [color-scheme:dark] [color-scheme:dark]">'
          ))

          marker = '                <div><label htmlFor="replacementPlayer" className="mb-2 block text-sm font-semibold">Replacement batsman</label>'
          fielder_block = '''                {(wicketType === "CAUGHT" || wicketType === "RUN_OUT" || wicketType === "STUMPED") && (\n                  <div>\n                    <label htmlFor="wicketFielder" className="mb-2 block text-sm font-semibold">{wicketType === "STUMPED" ? "Wicketkeeper" : wicketType === "CAUGHT" ? "Caught by" : "Fielder"}</label>\n                    <select\n                      id="wicketFielder"\n                      value={wicketFielderId}\n                      onChange={(event) => setWicketFielderId(event.target.value)}\n                      className="h-12 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 text-white [color-scheme:dark]"\n                    >\n                      <option value="">Select {wicketType === "STUMPED" ? "wicketkeeper" : "fielder"}</option>\n                      {wicketFielderOptions.map((player) => (\n                        <option key={player.id} value={player.id}>{player.name}</option>\n                      ))}\n                    </select>\n                  </div>\n                )}\n'''
          if marker in text:
              text = text.replace(marker, fielder_block + marker, 1)
          else:
              raise SystemExit('replacement player marker not found')

          replacements.append((
              'disabled={!replacementPlayerId || liveLoading} onClick={() => void recordLiveDelivery({ isWicket: true, wicketType, dismissedPlayerId, replacementPlayerId, ...(pendingWicketExtraType ? { runsExtra: pendingWicketExtraRuns, extraType: pendingWicketExtraType } : {}) })}',
              'disabled={!replacementPlayerId || ((wicketType === "CAUGHT" || wicketType === "RUN_OUT" || wicketType === "STUMPED") && !wicketFielderId) || liveLoading} onClick={() => void recordLiveDelivery({ isWicket: true, wicketType, dismissedPlayerId, replacementPlayerId, fielderId: wicketFielderId || undefined, ...(pendingWicketExtraType ? { runsExtra: pendingWicketExtraRuns, extraType: pendingWicketExtraType } : {}) })}'
          ))

          # Reset fielder whenever the wicket dialog is cancelled/completed.
          replacements.append((
              'setPendingWicketExtraRuns(0); setReplacementPlayerId(""); }} className="h-12 rounded-lg border border-slate-300',
              'setPendingWicketExtraRuns(0); setReplacementPlayerId(""); setWicketFielderId(""); }} className="h-12 rounded-lg border border-slate-300'
          ))

          # Pass fielder through the delivery payload.
          replacements.append((
              '    replacementPlayerId?: string;\n  }) {\n    if (!liveInningsId)',
              '    replacementPlayerId?: string;\n    fielderId?: string;\n  }) {\n    if (!liveInningsId)'
          ))

          replacements.append((
              '            ...input,\n          }),',
              '            ...input,\n          }),'
          ))

          for old, new in replacements:
              if old not in text:
                  # Allow intentional no-op replacements, but fail for required UI/state changes.
                  if old.startswith('  const [wicketType') or old.startswith('    setReplacementPlayerId') or old.startswith('    replacementPlayerId?: string;') or old.startswith('disabled={!replacementPlayerId'):
                      raise SystemExit(f'required page replacement not found: {old[:100]}')
                  continue
              text = text.replace(old, new, 1)

          # Scorecard needs the fielder id so dismissal details can name the player.
          text = text.replace(
              'wicket: { type: string; dismissedPlayerId: string; bowlerId: string | null } | null;',
              'wicket: { type: string; dismissedPlayerId: string; bowlerId: string | null; fielderId: string | null } | null;',
              1,
          )
          text = text.replace(
              'a.out = true; a.d = x.wicket.type.replaceAll("_", " "); fall.push',
              'a.out = true; a.d = `${x.wicket.type.replaceAll("_", " ")}${x.wicket.fielderId ? ` - ${playerName(x.wicket.fielderId)}` : ""}`; fall.push',
              1,
          )

          page.write_text(text, encoding='utf-8')

          scoring = Path('src/lib/scoring.ts')
          text = scoring.read_text(encoding='utf-8')
          old = '''    if (\n      input.replacementPlayerId ===\n      input.dismissedPlayerId\n    ) {\n      throw new Error(\n        "Replacement player cannot be the dismissed player.",\n      );\n    }'''
          new = '''    if (\n      input.replacementPlayerId ===\n      input.dismissedPlayerId\n    ) {\n      throw new Error(\n        "Replacement player cannot be the dismissed player.",\n      );\n    }\n\n    const fielderRequired =\n      input.wicketType === "CAUGHT" ||\n      input.wicketType === "RUN_OUT" ||\n      input.wicketType === "STUMPED";\n\n    if (fielderRequired && !input.fielderId) {\n      throw new Error(\n        "This dismissal requires the fielding player involved.",\n      );\n    }\n\n    if (input.fielderId) {\n      const fielder = await prisma.matchPlayer.findFirst({\n        where: {\n          matchId: innings.matchId,\n          teamId: innings.bowlingTeamId,\n          playerId: input.fielderId,\n        },\n        select: { playerId: true, isWicketKeeper: true },\n      });\n\n      if (!fielder) {\n        throw new Error(\n          "Fielder is not a match player for the bowling team.",\n        );\n      }\n\n      if (input.wicketType === "STUMPED" && !fielder.isWicketKeeper) {\n        throw new Error(\n          "A stumping must be credited to the wicketkeeper.",\n        );\n      }\n    }'''
          if old not in text:
              raise SystemExit('scoring wicket validation marker not found')
          text = text.replace(old, new, 1)
          scoring.write_text(text, encoding='utf-8')

          test = Path('src/lib/scoring.test.ts')
          text = test.read_text(encoding='utf-8')
          marker = '\n});\n'
          tests = r'''\n\n  it("records a caught dismissal with the fielder and credits the bowler", async () => {\n    const { innings, playersA, playersB } = await createFixture();\n\n    await recordPersistentDelivery({\n      inningsId: innings.id,\n      bowlerId: playersB[0].id,\n      strikerId: playersA[0].id,\n      nonStrikerId: playersA[1].id,\n      isWicket: true,\n      wicketType: "CAUGHT",\n      dismissedPlayerId: playersA[0].id,\n      replacementPlayerId: playersA[2].id,\n      fielderId: playersB[2].id,\n    });\n\n    const wicket = await prisma.wicket.findFirstOrThrow({\n      where: { delivery: { inningsId: innings.id } },\n    });\n\n    expect(wicket.type).toBe("CAUGHT");\n    expect(wicket.fielderId).toBe(playersB[2].id);\n    expect(wicket.bowlerId).toBe(playersB[0].id);\n  });\n\n  it("records a run out with the fielder but does not credit the bowler", async () => {\n    const { innings, playersA, playersB } = await createFixture();\n\n    await recordPersistentDelivery({\n      inningsId: innings.id,\n      bowlerId: playersB[0].id,\n      strikerId: playersA[0].id,\n      nonStrikerId: playersA[1].id,\n      isWicket: true,\n      wicketType: "RUN_OUT",\n      dismissedPlayerId: playersA[1].id,\n      replacementPlayerId: playersA[2].id,\n      fielderId: playersB[0].id,\n    });\n\n    const wicket = await prisma.wicket.findFirstOrThrow({\n      where: { delivery: { inningsId: innings.id } },\n    });\n\n    expect(wicket.type).toBe("RUN_OUT");\n    expect(wicket.fielderId).toBe(playersB[0].id);\n    expect(wicket.bowlerId).toBeNull();\n  });\n\n  it("requires a fielding player for caught, run out and stumped", async () => {\n    const { innings, playersA, playersB } = await createFixture();\n\n    await expect(recordPersistentDelivery({\n      inningsId: innings.id,\n      bowlerId: playersB[0].id,\n      strikerId: playersA[0].id,\n      nonStrikerId: playersA[1].id,\n      isWicket: true,\n      wicketType: "CAUGHT",\n      dismissedPlayerId: playersA[0].id,\n      replacementPlayerId: playersA[2].id,\n    })).rejects.toThrow("requires the fielding player involved");\n  });\n'''
          idx = text.rfind(marker)
          if idx < 0:
              raise SystemExit('test file closing marker not found')
          text = text[:idx] + tests + text[idx:]
          test.write_text(text, encoding='utf-8')

          print('Wicket dismissal patch applied.')
          PY

      - name: Verify
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --run

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/lib/scoring.ts src/lib/scoring.test.ts
          git commit -m "feat: record wicket dismissal details"
          git rm .github/workflows/implement-wicket-dismissals.yml
          git commit -m "chore: remove temporary wicket workflow"
          git push
