name: Apply scorecard redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scorecard redesign
        run: python3 .github/scorecard_redesign.py
      - name: Verify build
        run: npm ci && npx prisma generate && npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: compact scorecard layout"
          git rm .github/scorecard_redesign.py .github/workflows/apply-scorecard-redesign.yml
          git commit -m "chore: remove temporary scorecard redesign workflow"
          git push
