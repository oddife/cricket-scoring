name: Apply three live scoring fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/league-live-scorecard
          fetch-depth: 0

      - name: Patch league, live summary and target display
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path("src/app/page.tsx")
          text = page.read_text(encoding="utf-8")

          # 1) Target display: show remaining legal balls, not only overs.
          old = '''    const runsNeeded = liveTarget !== null
      ? Math.max(liveTarget - liveRuns, 0)
      : null;
'''
          new = '''    const runsNeeded = liveTarget !== null
      ? Math.max(liveTarget - liveRuns, 0)
      : null;
    const remainingTargetBalls = liveTarget !== null
      ? Math.max(oversPerInnings * 6 - legalBalls, 0)
      : null;
'''
          if old not in text:
              raise SystemExit("Target calculation block not found")
          text = text.replace(old, new, 1)

          old = '''                        <>TARGET: <span className="font-black">{liveTarget}</span> · NEED <span className="font-black">{runsNeeded}</span></>
'''
          new = '''                        <>TARGET: <span className="font-black">{liveTarget}</span> · NEED <span className="font-black">{runsNeeded}</span>{remainingTargetBalls !== null ? <> OFF <span className="font-black">{remainingTargetBalls}</span> {remainingTargetBalls === 1 ? "BALL" : "BALLS"}</> : null}</>
'''
          if old not in text:
              raise SystemExit("Target display block not found")
          text = text.replace(old, new, 1)

          # 2) Keep the four-innings live summary history synchronized after every delivery.
          marker = '''      const nextStriker =
        data.nextStrikerId ??
        result.nextStrikerId ??
        liveStrikerId;
'''
          insert = '''      const refreshedHistoryRuns = Number(
        data.innings?.totalRuns ?? data.totalRuns ?? liveRuns + totalRuns,
      );
      const refreshedHistoryWickets = Number(
        data.innings?.wickets ?? data.wickets ?? liveWickets + (input.isWicket ? 1 : 0),
      );
      setLiveInningsHistory((current) =>
        current.map((item) =>
          item.inningsNumber === liveInningsNumber
            ? { ...item, totalRuns: refreshedHistoryRuns }
            : item,
        ),
      );
      void refreshedHistoryWickets;

''' + marker
          if marker not in text:
              raise SystemExit("Delivery history marker not found")
          text = text.replace(marker, insert, 1)

          # 3) Refresh the open scorecard while the match is live so its four-innings
          # strip does not wait for match/innings completion.
          marker = '''  }

  function exportScorecardPdf() {
'''
          effect = '''  }

  useEffect(() => {
    if (!scorecardMatch || String(scorecardMatch.status).toUpperCase() !== "LIVE") {
      return;
    }

    const interval = window.setInterval(async () => {
      try {
        const response = await fetch(`/api/matches/${scorecardMatch.id}`, { cache: "no-store" });
        const data = await response.json();
        if (!response.ok) return;
        setScorecardMatch(data.match ?? data);
      } catch (error) {
        console.error("Live scorecard refresh failed:", error);
      }
    }, 2000);

    return () => window.clearInterval(interval);
  }, [scorecardMatch?.id, scorecardMatch?.status]);

  function exportScorecardPdf() {
'''
          if marker not in text:
              raise SystemExit("Scorecard polling insertion point not found")
          text = text.replace(marker, effect, 1)

          page.write_text(text, encoding="utf-8")

          # 4) Make league standings robust if an older completed match has no winnerId.
          league = Path("src/lib/league.ts")
          ltext = league.read_text(encoding="utf-8")

          helper_marker = '''function effectiveBalls(legalBalls: number, allOut: boolean, quotaBalls: number) {
  if (allOut && legalBalls < quotaBalls) return quotaBalls;
  return legalBalls;
}
'''
          helper = helper_marker + '''
function deriveWinnerId(match: {
  teamAId: string;
  teamBId: string;
  winnerId: string | null;
  innings: Array<{ battingTeamId: string; totalRuns: number }>;
}) {
  if (match.winnerId === match.teamAId || match.winnerId === match.teamBId) {
    return match.winnerId;
  }

  const totals = new Map<string, number>([
    [match.teamAId, 0],
    [match.teamBId, 0],
  ]);

  for (const innings of match.innings) {
    totals.set(
      innings.battingTeamId,
      (totals.get(innings.battingTeamId) ?? 0) + innings.totalRuns,
    );
  }

  const teamARuns = totals.get(match.teamAId) ?? 0;
  const teamBRuns = totals.get(match.teamBId) ?? 0;
  if (teamARuns === teamBRuns) return null;
  return teamARuns > teamBRuns ? match.teamAId : match.teamBId;
}
'''
          if "function deriveWinnerId(" not in ltext:
              if helper_marker not in ltext:
                  raise SystemExit("League helper insertion point not found")
              ltext = ltext.replace(helper_marker, helper, 1)

          old = '''    } else if (match.winnerId === match.teamAId) {
      a.won += 1;
      b.lost += 1;
      a.points += tournament.winPoints;
      b.points += tournament.lossPoints;
    } else if (match.winnerId === match.teamBId) {
      b.won += 1;
      a.lost += 1;
      b.points += tournament.winPoints;
      a.points += tournament.lossPoints;
    }
'''
          new = '''    } else {
      const winnerId = deriveWinnerId(match);
      if (winnerId === match.teamAId) {
        a.won += 1;
        b.lost += 1;
        a.points += tournament.winPoints;
        b.points += tournament.lossPoints;
      } else if (winnerId === match.teamBId) {
        b.won += 1;
        a.lost += 1;
        b.points += tournament.winPoints;
        a.points += tournament.lossPoints;
      }
    }
'''
          if old not in ltext:
              raise SystemExit("League winner block not found")
          ltext = ltext.replace(old, new, 1)
          league.write_text(ltext, encoding="utf-8")

          # Remove this one-shot workflow after applying the patch.
          Path(".github/workflows/apply-three-live-fixes.yml").unlink()

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/lib/league.ts .github/workflows/apply-three-live-fixes.yml
          git commit -m "fix: update live scorecard and league points" || exit 0
          git push origin fix/league-live-scorecard
