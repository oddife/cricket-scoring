name: Patch Previous Matches Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch dashboard
        run: python3 -c "from pathlib import Path; p=Path('src/app/page.tsx'); s=p.read_text(encoding='utf-8-sig'); start=s.find('        {/* Matches */}'); end=s.find('    );\\n  }\\n\\n  // ---------------------------------------------------------\\n  // Player selection',start); r=Path('.github/previous-matches-section.txt').read_text(); assert start>=0, 'Matches marker not found'; assert end>=0, 'Dashboard end marker not found'; assert 'Previous Matches' not in s, 'Patch already present'; p.write_text(s[:start]+r+'\\n'+s[end:],encoding='utf-8')"

      - name: Commit dashboard change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --quiet || (git commit -m "Add previous matches dashboard [previous-matches-patch]" && git push)
