name: Apply LiveScoring Optimization
on:
  push:
    branches: [performance/mobile-optimization-2026-09]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finish optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/HomeContent.tsx')
          s = p.read_text()

          if 'const liveScoringStats = useMemo' not in s:
              raise SystemExit('liveScoringStats integration is missing')

          s, n = re.subn(
              r'const currentPartnershipDeliveries = \(\(\) => \{.*?const partnershipBalls = currentPartnershipDeliveries\.filter\(\n      \(delivery\) => delivery\.isLegal,\n    \)\.length;\n',
              'const partnershipRuns = liveScoringStats.partnership.runs;\n    const partnershipBalls = liveScoringStats.partnership.balls;\n\n',
              s,
              count=1,
              flags=re.S,
          )
          if n == 0 and 'const partnershipRuns = liveScoringStats.partnership.runs;' not in s:
              raise SystemExit('partnership block marker not found')

          s, n = re.subn(
              r'const extras = liveDeliveries\.reduce\(.*?\n    \);\n\n    const fallOfWickets =',
              'const extras = liveScoringStats.extras;\n\n    const fallOfWickets =',
              s,
              count=1,
              flags=re.S,
          )
          if n == 0 and 'const extras = liveScoringStats.extras;' not in s:
              raise SystemExit('extras block marker not found')

          s, n = re.subn(
              r'const fallOfWickets = liveDeliveries\n      \.filter\(\(delivery\) => delivery\.wicket\)\n      \.map\(\(delivery\) => \(\{.*?\n      \}\)\);',
              '''const fallOfWickets = liveScoringStats.fallOfWickets.map((wicket) => ({\n      player: liveBattingPlayers.find((player) => player.id === wicket.playerId),\n      score: wicket.runs,\n      over: `${Math.max(wicket.overNumber - 1, 0)}.${wicket.ballNumber}`,\n    }));''',
              s,
              count=1,
              flags=re.S,
          )
          if n == 0 and 'const fallOfWickets = liveScoringStats.fallOfWickets.map' not in s:
              raise SystemExit('fall of wickets block marker not found')

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/HomeContent.tsx
          if git diff --cached --quiet; then
            echo 'Live scoring aggregation already optimized'
          else
            git commit -m 'Remove remaining live score history scans'
            git push
          fi
