name: Apply LiveScoring Optimization
on:
  push:
    branches: [performance/mobile-optimization-2026-09]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/HomeContent.tsx')
          s = p.read_text()

          if 'useMemo' not in s.split('\n', 8)[4]:
              s = s.replace('import { useEffect, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";', 1)

          if 'import { calculateLiveScoringStats }' not in s:
              marker = 'import AppLogoEditor from "@/components/AppLogoEditor";'
              if marker not in s:
                  raise SystemExit('AppLogoEditor import marker not found')
              s = s.replace(marker, marker + '\nimport { calculateLiveScoringStats } from "@/lib/live-scoring/stats";', 1)

          start = s.index('const currentOverDeliveries = liveDeliveries.filter')
          render_end = s.index('return (', start)
          if 'const liveScoringStats = useMemo' not in s[start:render_end]:
              inject = '''const liveScoringStats = useMemo(\n      () => calculateLiveScoringStats(liveDeliveries, liveBattingPlayers, liveBowlingPlayers),\n      [liveDeliveries, liveBattingPlayers, liveBowlingPlayers],\n    );\n\n    '''
              s = s[:start] + inject + s[start:]

          start = s.index('const currentOverDeliveries = liveDeliveries.filter')
          a = s.index('const battingStats =', start)
          b = s.index('const bowlingStats =', a)
          s = s[:a] + '''const battingStats = liveScoringStats.batting.map((stat) => ({\n      player: liveBattingPlayers.find((player) => player.id === stat.id)!,\n      runs: stat.runs, balls: stat.balls, fours: stat.fours, sixes: stat.sixes,\n      strikeRate: stat.balls ? ((stat.runs / stat.balls) * 100).toFixed(2) : "0.00",\n      dismissed: liveDeliveries.some((delivery) => delivery.wicket?.dismissedPlayerId === stat.id),\n    }));\n\n    ''' + s[b:]

          a = s.index('const bowlingStats =', start)
          b = s.index('const currentPartnershipDeliveries =', a)
          s = s[:a] + '''const bowlingStats = liveScoringStats.bowling.map((stat) => ({\n      player: liveBowlingPlayers.find((player) => player.id === stat.id)!,\n      deliveries: stat.legalBalls, legal: stat.legalBalls, overs: stat.overs, runs: stat.runs, wickets: stat.wickets, economy: stat.legalBalls ? stat.economy.toFixed(2) : "0.00",\n    }));\n\n    ''' + s[b:]

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/HomeContent.tsx
          if git diff --cached --quiet; then
            echo 'Live scoring optimization already applied'
          else
            git commit -m 'Memoize live scoring calculations'
            git push
          fi
