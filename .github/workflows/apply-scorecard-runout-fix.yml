name: Apply scorecard and run-out fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix
        run: python3 scripts/fix-scorecard-runout-bugs.py

      - name: Verify build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Commit fix and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: scorecard null safety and run-out selection"
          git rm scripts/fix-scorecard-runout-bugs.py .github/workflows/apply-scorecard-runout-fix.yml
          git commit -m "chore: remove scorecard run-out fix runner"
          git push
