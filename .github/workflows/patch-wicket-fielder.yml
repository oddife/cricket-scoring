name: Patch wicket fielder UI

on:
  push:
    branches:
      - wicket-dismissal-2026-08-13

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply wicket fielder UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/patch_wicket_fielder.py

      - name: Verify
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm test -- --run

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.tsx
          git rm scripts/patch_wicket_fielder.py .github/workflows/patch-wicket-fielder.yml
          git commit -m 'chore: apply wicket fielder UI'
          git push
