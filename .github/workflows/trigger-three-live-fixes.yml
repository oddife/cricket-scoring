name: Trigger three live scoring fixes

on:
  push:
    branches:
      - fix/league-live-scorecard

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    if: ${{ !contains(github.event.head_commit.message, 'remove fix trigger') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fix workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run apply-three-live-fixes.yml --ref fix/league-live-scorecard

      - uses: actions/checkout@v4
        with:
          ref: fix/league-live-scorecard
          fetch-depth: 0

      - name: Remove trigger workflow
        shell: bash
        run: |
          rm -f .github/workflows/trigger-three-live-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/trigger-three-live-fixes.yml
          git commit -m "chore: remove fix trigger" || exit 0
          git push origin fix/league-live-scorecard
