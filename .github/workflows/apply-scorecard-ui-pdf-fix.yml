name: Apply scorecard UI PDF fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scorecard UI changes
        run: python3 .github/scorecard_ui_fix.py
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/app/globals.css
          git commit -m "feat: compact match info and export scorecard PDF"
          git rm .github/scorecard_ui_fix.py .github/workflows/apply-scorecard-ui-pdf-fix.yml
          git commit -m "chore: remove temporary scorecard UI workflow"
          git push
