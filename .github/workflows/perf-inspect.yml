name: Inspect LiveScoring
on:
  push:
    branches: [performance/mobile-optimization-2026-09]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python3 - <<'PY'
          s=open('src/components/HomeContent.tsx').read()
          a=s.index('const currentOverDeliveries = liveDeliveries.filter')
          b=s.index('return (', a)
          print('---DERIVED BLOCK---')
          print(s[a:b])
          print('---END---')
          PY