name: Apply current match format layout

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch exact current Match Format JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()

          old = '''                <p className="text-xs font-bold uppercase tracking-wide text-slate-600">Match Format</p>
                <div className="mt-4 space-y-3 text-sm">
                  <div className="flex justify-between"><span>Overs per Innings</span><b>{oversPerInnings}</b></div>
                  <div className="flex justify-between"><span>Innings</span><b>{inningsPerMatch}</b></div>
                  <div className="flex justify-between gap-3">
  <span>Toss</span>
  <b className="text-right">
    {tossWinnerId
      ? `${selectedTournament?.teams.find((item) => item.team.id === tossWinnerId)?.team.name ?? "Team"} won · elected to ${tossDecision === "BAT" ? "bat" : "bowl"}`
      : "Not recorded"}
  </b>
</div>
                  <div className="flex justify-between gap-3"><span>Bowling</span><b className="text-right">{doubleMode ? "Double Bowler" : "Normal"}</b></div>
                </div>

                <div className="mt-6 rounded-lg bg-emerald-50 px-3 py-3 text-sm font-semibold text-emerald-700">
                  LIVE &nbsp; In Progress
                </div>'''

          new = '''                <div className="mb-3 text-xs font-bold uppercase tracking-wide text-slate-600">Match Format</div>
                <div className="grid gap-x-6 gap-y-2 text-sm sm:grid-cols-2">
                  <div className="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2">
                    <span className="text-slate-500">Overs per Innings</span>
                    <b className="shrink-0">{oversPerInnings}</b>
                  </div>
                  <div className="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2">
                    <span className="text-slate-500">Toss</span>
                    <b className="text-right text-xs">
                      {tossWinnerId
                        ? `${selectedTournament?.teams.find((item) => item.team.id === tossWinnerId)?.team.name ?? "Team"} won · elected to ${tossDecision === "BAT" ? "bat" : "bowl"}`
                        : "Not recorded"}
                    </b>
                  </div>
                  <div className="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2">
                    <span className="text-slate-500">Innings</span>
                    <b className="shrink-0">{inningsPerMatch}</b>
                  </div>
                  <div className="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2">
                    <span className="text-slate-500">Bowling</span>
                    <b className="shrink-0">{doubleMode ? "Double Bowler" : "Normal"}</b>
                  </div>
                </div>

                <div className="mt-3 flex flex-wrap items-center justify-between gap-2 rounded-lg bg-emerald-50 px-3 py-2.5 text-sm font-semibold text-emerald-700">
                  <span>● LIVE &nbsp; In Progress</span>
                  {liveTarget !== null && (
                    <span className="text-right text-emerald-800">
                      Target for {battingTeam?.team.shortName ?? battingTeam?.team.name ?? "batting team"}: {liveTarget} runs · NEED {runsNeeded}
                    </span>
                  )}
                </div>'''

          if old not in s:
              raise SystemExit('Exact current Match Format block was not found; refusing to modify another section.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Match Format block patched exactly once.')
          PY

      - name: Verify production build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: compact current match format layout"
          git push origin main
          git rm -f .github/workflows/apply-match-format-layout.yml
          git commit -m "chore: remove match format patch workflow"
          git push origin main
