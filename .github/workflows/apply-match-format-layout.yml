name: Apply actual scorecard match format layout

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch only the scorecard Match Format block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/app/page.tsx')
          s = p.read_text()

          old = '''                  <div className="mt-4 grid gap-3 md:grid-cols-2">
                    <section>
                      <h3 className="text-sm font-black uppercase tracking-wide text-slate-500">Match Format</h3>
                      <dl className="mt-2 grid gap-y-2 text-sm">
                        <div className="flex justify-between gap-4">
                          <dt>Overs per Innings</dt>
                          <dd className="font-bold">{match.oversPerInnings}</dd>
                        </div>
                        <div className="flex justify-between gap-4">
                          <dt>Innings</dt>
                          <dd className="font-bold">{match.inningsPerMatch}</dd>
                        </div>
                      </dl>
                    </section>

                    <section>
                      <h3 className="sr-only">Match Details</h3>
                      <dl className="grid gap-y-2 text-sm">
                        <div className="flex justify-between gap-4">
                          <dt>Toss</dt>
                          <dd className="text-right font-bold">{tossText}</dd>
                        </div>
                        <div className="flex justify-between gap-4">
                          <dt>Bowling</dt>
                          <dd className="text-right font-bold">{bowlingText}</dd>
                        </div>
                      </dl>
                    </section>
                  </div>'''

          new = '''                  <div className="mt-4 rounded-xl border border-slate-200 bg-white px-3 py-3">
                    <h3 className="mb-2 text-xs font-black uppercase tracking-wide text-slate-500">Match Format</h3>
                    <div className="grid gap-x-6 gap-y-2 text-sm sm:grid-cols-2">
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-slate-500">Overs per Innings</span>
                        <b className="shrink-0">{match.oversPerInnings}</b>
                      </div>
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-slate-500">Toss</span>
                        <b className="text-right text-xs">{tossText}</b>
                      </div>
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-slate-500">Innings</span>
                        <b className="shrink-0">{match.inningsPerMatch}</b>
                      </div>
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-slate-500">Bowling</span>
                        <b className="shrink-0">{bowlingText}</b>
                      </div>
                    </div>
                  </div>'''

          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one original Match Format block, found {s.count(old)}')

          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Match Format block replaced exactly once.')
          PY

      - name: Verify production build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: compact scorecard match format layout"
          git push origin main
          git rm -f .github/workflows/apply-match-format-layout.yml
          git commit -m "chore: remove scorecard layout workflow"
          git push origin main
