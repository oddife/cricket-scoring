name: Apply actual scorecard match format layout

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch actual scorecard Match Format block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/app/page.tsx')
          s = p.read_text()

          pattern = re.compile(r'''                  <div className="mt-4 grid gap-3 md:grid-cols-2">.*?                  </div>\n\n                  <div className=\{`mt-3 flex flex-col gap-2 rounded-xl px-3 py-2\.5 text-sm font-bold sm:flex-row sm:items-center sm:justify-between \$\{matchStatus === "COMPLETED" \? "bg-slate-100 text-slate-700" : "bg-emerald-50 text-emerald-700"\}`\}>.*?                  </div>''', re.S)

          replacement = '''                  <div className="mt-4 rounded-xl border border-slate-200 bg-white px-3 py-2.5">
                    <div className="mb-2 text-xs font-black uppercase tracking-wide text-slate-500">Match Format</div>
                    <div className="grid gap-x-6 gap-y-2 text-sm sm:grid-cols-2">
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-slate-500">Overs per Innings</span>
                        <b className="shrink-0">{match.oversPerInnings}</b>
                      </div>
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-slate-500">Toss</span>
                        <b className="text-right text-xs">{tossText}</b>
                      </div>
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-slate-500">Innings</span>
                        <b className="shrink-0">{match.inningsPerMatch}</b>
                      </div>
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-slate-500">Bowling</span>
                        <b className="shrink-0">{bowlingText}</b>
                      </div>
                    </div>
                  </div>

                  <div className={`mt-3 flex flex-wrap items-center justify-between gap-2 rounded-xl px-3 py-2.5 text-sm font-bold ${matchStatus === "COMPLETED" ? "bg-slate-100 text-slate-700" : "bg-emerald-50 text-emerald-700"}`}>
                    <div className="flex items-center gap-3 whitespace-nowrap">
                      <span>{matchStatus === "COMPLETED" ? "✓ COMPLETED" : "● LIVE"}</span>
                      <span>{resultText}</span>
                    </div>
                    {target != null && (
                      <div className="text-xs font-semibold text-slate-700 sm:text-right">
                        Target for <b>{targetTeam}</b> (batting last) in <b>inning {match.inningsPerMatch}</b>: <b className="text-emerald-700">{target} runs</b>
                      </div>
                    )}
                  </div>'''

          matches = pattern.findall(s)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one scorecard Match Format/status block, found {len(matches)}')
          s = pattern.sub(replacement, s, count=1)
          p.write_text(s)
          print('Scorecard Match Format block patched exactly once.')
          PY

      - name: Verify production build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: compact scorecard match format layout"
          git push origin main
          git rm -f .github/workflows/apply-match-format-layout.yml
          git commit -m "chore: remove scorecard layout workflow"
          git push origin main
