name: Patch wicket UI only

on:
  push:
    branches:
      - wicket-dismissal-2026-08-13

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wicket-dismissal-2026-08-13
          fetch-depth: 1

      - name: Apply frontend-only wicket UI patch
        run: python3 scripts/patch-wicket-ui-only.py

      - name: Verify frontend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          node scripts/run-tests.mjs --run

      - name: Commit frontend patch and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: restore wicket selector UI in live scorecard"
          git push origin wicket-dismissal-2026-08-13
          git rm scripts/patch-wicket-ui-only.py .github/workflows/patch-wicket-ui-only.yml
          git commit -m "chore: remove temporary wicket UI patch workflow"
          git push origin wicket-dismissal-2026-08-13
