name: Fix previous matches layout

on:
  push:
    branches:
      - fix/previous-matches-compact

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'oddife'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/previous-matches-compact
          fetch-depth: 0

      - name: Patch previous matches UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/app/page.tsx')
          s = p.read_text(encoding='utf-8')

          old_winner = '''              const winnerId =
                firstInnings && lastInnings && innings.length === 2
                  ? firstInnings.totalRuns > lastInnings.totalRuns
                    ? firstInnings.battingTeamId
                    : firstInnings.totalRuns < lastInnings.totalRuns
                      ? lastInnings.battingTeamId
                      : null
                  : null;

              const winnerName =
                winnerId === match.teamA.id
                  ? match.teamA.name
                  : winnerId === match.teamB.id
                    ? match.teamB.name
                    : null;'''

          new_winner = '''              const winnerName =
                match.winnerId === match.teamA.id
                  ? match.teamA.name
                  : match.winnerId === match.teamB.id
                    ? match.teamB.name
                    : null;'''

          if old_winner not in s:
              raise SystemExit('Winner calculation block not found')
          s = s.replace(old_winner, new_winner, 1)

          old_header = '''                  <button
                    type="button"
                    onClick={() => setExpandedMatchId(expanded ? null : match.id)}
                    className="w-full text-left"
                    aria-expanded={expanded}
                  >
                    <div className="grid min-w-0 gap-1.5 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">
                      <div className="flex min-w-0 items-center justify-between gap-3">
                        <p className="truncate text-base font-bold text-slate-100">
                          {match.teamA.name} <span className="text-slate-600">vs</span> {match.teamB.name}
                        </p>
                        <span className="whitespace-nowrap text-xs font-medium text-slate-500">
                          {new Date(match.createdAt).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" })}
                        </span>
                      </div>

                      <div className="flex min-w-0 flex-wrap items-center gap-x-4 gap-y-1 text-sm">
                        {firstInnings && (
                          <span className="truncate text-slate-300">
                            <b className="text-slate-100">{teamName(firstInnings.battingTeamId)}</b> {formatScore(firstInnings)}
                          </span>
                        )}
                        {lastInnings && lastInnings.id !== firstInnings?.id && (
                          <span className="truncate text-slate-300">
                            <b className="text-slate-100">{teamName(lastInnings.battingTeamId)}</b> {formatScore(lastInnings)}
                          </span>
                        )}
                        <span className="text-xs text-slate-500">{expanded ? "Collapse" : "Expand"}</span>
                      </div>
                    </div>
                  </button>'''

          new_header = '''                  <button
                    type="button"
                    onClick={() => setExpandedMatchId(expanded ? null : match.id)}
                    className="w-full text-left"
                    aria-expanded={expanded}
                  >
                    <div className="flex min-w-0 items-center justify-between gap-3">
                      <p className="truncate text-base font-bold text-slate-100">
                        {match.teamA.name} <span className="text-slate-600">vs</span> {match.teamB.name}
                      </p>
                      <div className="flex shrink-0 items-center gap-3">
                        <span className="whitespace-nowrap text-xs font-medium text-slate-500">
                          {new Date(match.createdAt).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" })}
                        </span>
                        <span className="text-xs text-slate-500">{expanded ? "Collapse" : "Expand"}</span>
                      </div>
                    </div>
                  </button>'''

          if old_header not in s:
              raise SystemExit('Previous matches header block not found')
          s = s.replace(old_header, new_header, 1)

          p.write_text(s, encoding='utf-8')
          print('Previous matches layout and winner source updated.')
          PY

      - name: Verify
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm test -- --run

      - name: Commit patch and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git rm .github/workflows/fix-previous-matches-layout.yml
          git commit -m "fix: simplify previous matches header and use match winner"
          git push origin HEAD:fix/previous-matches-compact
