name: Finish mobile scorer optimization

on:
  push:
    branches:
      - performance/mobile-optimization-2026-09

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/mobile-optimization-2026-09
          fetch-depth: 1
      - name: Finish scorer state handling
        shell: python
        run: |
          from pathlib import Path

          home = Path('src/components/HomeContent.tsx')
          text = home.read_text()
          text = text.replace('import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useState } from "react";')

          old = '''      if (overCompleted) {\n        setLiveCurrentOver(\n          Number(\n            data.nextOver ??\n              result.nextOver ??\n              liveCurrentOver + 1,\n          ),\n        );'''
          new = '''      if (overCompleted) {\n        setLiveCurrentOver(\n          Number(\n            data.nextOver ??\n              result.nextOver ??\n              liveCurrentOver + 1,\n          ),\n        );\n        setLiveCurrentBall(1);\n        setLiveDeliveryCount(0);'''
          if old not in text:
              raise SystemExit('over completion block not found')
          text = text.replace(old, new, 1)
          home.write_text(text)

          route = Path('src/app/api/innings/[inningsId]/deliveries/route.ts')
          text = route.read_text()
          old = '''      target: innings.target,\n    };'''
          new = '''      target: innings.target,\n      inningsNumber: innings.inningsNumber,\n      battingTeamId: innings.battingTeamId,\n      bowlingTeamId: innings.bowlingTeamId,\n      previousOverBowlerAId: innings.previousOverBowlerAId,\n      previousOverBowlerBId: innings.previousOverBowlerBId,\n      match: {\n        id: innings.match.id,\n        inningsPerMatch: innings.match.inningsPerMatch,\n        innings: innings.match.innings,\n      },\n    };'''
          if old not in text:
              raise SystemExit('final innings return block not found')
          text = text.replace(old, new, 1)
          route.write_text(text)
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomeContent.tsx 'src/app/api/innings/[inningsId]/deliveries/route.ts'
          git diff --cached --quiet && exit 0
          git commit -m "Complete local scorer state synchronization"
          git push origin HEAD:performance/mobile-optimization-2026-09
