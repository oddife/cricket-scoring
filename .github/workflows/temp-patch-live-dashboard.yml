name: Temporary patch live dashboard polling

on:
  push:
    branches:
      - fix/league-live-scorecard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/league-live-scorecard
          fetch-depth: 0

      - name: Patch dashboard live polling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/page.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '''  useEffect(() => {\n    void loadTournaments();\n  }, []);\n'''
          addition = '''\n  useEffect(() => {\n    if (pageMode !== "DASHBOARD" || !selectedTournament?.id) {\n      return;\n    }\n\n    void loadLiveMatches(selectedTournament.id);\n    const timer = window.setInterval(() => {\n      void loadLiveMatches(selectedTournament.id);\n    }, 3000);\n\n    return () => window.clearInterval(timer);\n  }, [pageMode, selectedTournament?.id]);\n'''
          if 'window.setInterval(() => {\n      void loadLiveMatches(selectedTournament.id);' not in text:
              if marker not in text:
                  raise SystemExit('Polling insertion marker not found')
              text = text.replace(marker, marker + addition, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm test -- --run

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temp-patch-live-dashboard.yml
          git add src/app/page.tsx .github/workflows/temp-patch-live-dashboard.yml
          git commit -m "fix: refresh live dashboard scores" || exit 0
          git push origin fix/league-live-scorecard
