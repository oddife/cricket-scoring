name: Apply swap batsmen UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI change
        run: python3 .github/swap_ui_fix.py
      - name: Verify
        run: npm ci && npx prisma generate && npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: keep swap batsmen available"
          git rm .github/swap_ui_fix.py .github/workflows/apply-swap-ui-fix.yml
          git commit -m "chore: remove temporary swap UI workflow"
          git push
