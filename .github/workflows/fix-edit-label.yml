name: Fix edit label

on:
  push:
    branches:
      - fix/team-player-roster-removal

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'oddife'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate edit label
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/page.tsx')
          text = path.read_text()
          old = '''                          <span>EDIT</span>\n                          <span className="hidden sm:inline">\n                            Edit\n                          </span>'''
          new = '''                          <span>EDIT</span>'''
          if old not in text:
              raise SystemExit('Target edit label block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: remove duplicate player edit label"
          git push
