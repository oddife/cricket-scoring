name: Test

on:
  push:
    branches:
      - main
      - fix/league-live-scorecard
      - fix/team-player-roster-removal
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

# Final branch validation for the roster UI changes.
