name: Apply exact scorecard format patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch exact Match Format section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/app/page.tsx")
          s = p.read_text()

          start_marker = '                  <div className="mt-4 grid gap-3 md:grid-cols-2">'
          end_marker = '                  <div className={`mt-3 flex flex-col gap-2 rounded-xl'

          start = s.find(start_marker)
          if start < 0:
              raise SystemExit("Could not find current Match Format block")
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit("Could not find end of Match Format block")

          new_block = '''                  <div className="mt-4 grid gap-3 md:grid-cols-2">
                    <section>
                      <h3 className="text-sm font-black uppercase tracking-wide text-slate-500">Match Format</h3>
                      <div className="mt-2 grid gap-2 text-sm">
                        <div className="flex items-center justify-between gap-4">
                          <span>Overs per Innings</span>
                          <b>{match.oversPerInnings}</b>
                        </div>
                        <div className="flex items-center justify-between gap-4">
                          <span>Innings</span>
                          <b>{match.inningsPerMatch}</b>
                        </div>
                      </div>
                    </section>

                    <section>
                      <h3 className="sr-only">Match Details</h3>
                      <div className="grid gap-2 text-sm">
                        <div className="flex items-center justify-between gap-4">
                          <span>Toss</span>
                          <b className="text-right">{tossText}</b>
                        </div>
                        <div className="flex items-center justify-between gap-4">
                          <span>Bowling</span>
                          <b className="text-right">{bowlingText}</b>
                        </div>
                      </div>
                    </section>
                  </div>

'''

          s = s[:start] + new_block + s[end:]
          p.write_text(s)
          print("Exact Match Format section replaced.")
          PY

      - name: Verify production build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: compact scorecard match format"
          git push origin main
          git rm .github/workflows/fix-scorecard-format-final.yml
          git commit -m "chore: remove scorecard patch workflow"
          git push origin main
