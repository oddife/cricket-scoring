name: Temporary completed tournament UI fix

on:
  push:
    branches:
      - fix/completed-tournament-status-winner

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update tournament list UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/page.tsx')
          text = path.read_text()

          if 'status: "ACTIVE" | "COMPLETED";' not in text:
              new_type = '''type Tournament = {
                id: string;
                name: string;
                season: string | null;
                format: string;
                startDate: string | null;
                endDate: string | null;
                status: "ACTIVE" | "COMPLETED";
                winner: {
                  id: string;
                  name: string;
                  shortName: string | null;
                  logo: string | null;
                } | null;
                teams: TournamentTeam[];
                _count: {
                  matches: number;
                };
              };'''
              pattern = re.compile(r'type Tournament = \{.*?\n\};\n\ntype ScorecardMatch', re.S)
              replacement = new_type + '\n\ntype ScorecardMatch'
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Tournament type regex did not match')

          if 'Winner: {tournament.winner.name}' not in text:
              start = text.find('Existing Tournaments')
              if start < 0:
                  raise SystemExit('Existing Tournaments section not found')
              tail = text[start:]
              pattern = re.compile(r'(?P<metadata>\{\s*formatLabels\[\s*tournament\.format\s*\]\s*\}\s*</p>)', re.S)
              match = pattern.search(tail)
              if not match:
                  raise SystemExit('Tournament format metadata not found')
              metadata = match.group('metadata')
              addition = metadata + '''

                        {tournament.status === "COMPLETED" && (
                          <div className="mt-2 flex flex-wrap items-center gap-2">
                            <span className="rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wide text-emerald-400">
                              COMPLETED
                            </span>
                            {tournament.winner && (
                              <span className="text-xs font-medium text-slate-300">
                                Winner: {tournament.winner.name}
                              </span>
                            )}
                          </div>
                        )}'''
              tail = tail[:match.start()] + addition + tail[match.end():]
              text = text[:start] + tail

          path.write_text(text)
          PY

      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: completed tournament UI"
          git push
