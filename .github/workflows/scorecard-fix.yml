name: Finish Match Scorecard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scorecard patch
        run: python3 .github/scorecard_patch.py
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scorecard_patch.py .github/workflows/add-scorecard.yml .github/workflows/scorecard-fix.yml
          git add src/app/page.tsx .github/scorecard_patch.py .github/workflows/add-scorecard.yml .github/workflows/scorecard-fix.yml
          git diff --cached --quiet || (git commit -m "Add full match scorecard" && git push)
