name: Apply final wicket backend update

on:
  push:
    branches:
      - wicket-dismissal-2026-08-13

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix: allow final wicket without replacement')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch scoring backend
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/lib/scoring.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("\r\n", "\n")

          final_wicket = '''  const finalWicket =
    input.isWicket === true &&
    innings.wickets + 1 >= battingPlayers.length - 1;

'''

          anchor = '  if (!battingIds.has(input.strikerId)) {'
          if text.count(anchor) != 1:
              raise SystemExit(f"striker anchor count={text.count(anchor)}")
          if "const finalWicket =" not in text:
              text = text.replace(anchor, final_wicket + anchor, 1)

          required = '''    if (!input.replacementPlayerId) {
      throw new Error(
        "A wicket requires a replacement player.",
      );
    }'''

          optional = '''    if (!input.replacementPlayerId && !finalWicket) {
      throw new Error(
        "A wicket requires a replacement player.",
      );
    }'''

          if text.count(required) != 1 and "&& !finalWicket" not in text:
              raise SystemExit(f"replacement requirement count={text.count(required)}")
          if required in text:
              text = text.replace(required, optional, 1)

          start = text.find('    if (\n      !battingIds.has(\n        input.replacementPlayerId,')
          end_marker = '''  } else if (
    input.dismissedPlayerId ||
    input.replacementPlayerId
  ) {'''
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit(f"replacement validation block not found start={start} end={end}")

          block = text[start:end]
          if not block.lstrip().startswith('if (input.replacementPlayerId)'):
              text = text[:start] + '    if (input.replacementPlayerId) {\n' + block + '    }\n' + text[end:]

          old_complete = '''  const inningsComplete =
    newLegalBalls >=
    innings.match.oversPerInnings * 6;'''
          new_complete = '''  const inningsComplete =
    finalWicket ||
    newLegalBalls >=
      innings.match.oversPerInnings * 6;'''
          if old_complete in text:
              text = text.replace(old_complete, new_complete, 1)
          elif new_complete not in text:
              raise SystemExit("innings completion rule not found")

          path.write_text(text, encoding="utf-8", newline="\n")
          print("Final wicket backend update applied")

      - name: Typecheck and tests
        run: |
          npm ci
          npx tsc --noEmit
          node scripts/run-tests.mjs --run

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/scoring.ts
          git rm .github/workflows/apply-final-wicket-backend.yml
          git commit -m "fix: allow final wicket without replacement"
          git push
