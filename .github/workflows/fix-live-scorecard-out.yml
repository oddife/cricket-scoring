name: Apply live scorecard UI cleanup

on:
  push:
    branches:
      - wicket-dismissal-2026-08-13

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix: live scorecard dismissal label')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove live OUT label
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/app/page.tsx")
          text = path.read_text(encoding="utf-8")
          old = '{stat.player.name}{stat.player.id === liveStrikerId ? " *" : ""}{stat.dismissed ? " OUT" : ""}'
          new = '{stat.player.name}{stat.player.id === liveStrikerId ? " *" : ""}'
          if old not in text:
              raise SystemExit("Expected live scorecard OUT label was not found; aborting without changes.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify and commit
        run: |
          grep -n 'stat.dismissed ? " OUT"' src/app/page.tsx && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git rm .github/workflows/fix-live-scorecard-out.yml
          git commit -m "fix: live scorecard dismissal label"
          git push
