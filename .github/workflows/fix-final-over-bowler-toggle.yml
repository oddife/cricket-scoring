name: Verify final over bowler fix

on:
  push:
    branches:
      - feature/custom-delivery-runs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'oddife'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/custom-delivery-runs
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/fix-final-over-bowler-toggle.py

      - name: Verify
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm test -- --run

      - name: Commit patch and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git rm scripts/fix-final-over-bowler-toggle.py .github/workflows/fix-final-over-bowler-toggle.yml
          git commit -m "fix: keep selected bowler through odd final over"
          git push origin HEAD:feature/custom-delivery-runs
