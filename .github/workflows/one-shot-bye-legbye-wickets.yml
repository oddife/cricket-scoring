name: One-shot bye leg-bye wicket fix

on:
  push:
    branches:
      - feature/custom-delivery-runs

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'oddife'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/custom-delivery-runs
          fetch-depth: 0

      - name: Update custom delivery wicket support
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text(encoding='utf-8-sig')
          replacements = [
            (
              'useState<"WIDE" | "NO_BALL" | null>(null);',
              'useState<"WIDE" | "NO_BALL" | "BYE" | "LEG_BYE" | null>(null);',
            ),
            (
              'function openWicketPanel(extraType: "WIDE" | "NO_BALL" | null = null, runsExtra = 0)',
              'function openWicketPanel(extraType: "WIDE" | "NO_BALL" | "BYE" | "LEG_BYE" | null = null, runsExtra = 0)',
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected text not found: {old}')
            s = s.replace(old, new, 1)

          old = '''    if (includeWicket && customDeliveryType !== "WIDE" && customDeliveryType !== "NO_BALL") {
      setError("A wicket with an extra is currently supported for Wide and No Ball.");
      return;
    }

    setShowCustomDeliveryPanel(false);

    if (includeWicket) {
      if (customDeliveryType !== "WIDE" && customDeliveryType !== "NO_BALL") {
        setError("A wicket with an extra is currently supported for Wide and No Ball.");
        return;
      }

      openWicketPanel(customDeliveryType, parsedRuns);
      return;
    }'''
          new = '''    setShowCustomDeliveryPanel(false);

    if (includeWicket) {
      const wicketExtraType =
        customDeliveryType === "BAT" ? null : customDeliveryType;
      const wicketExtraRuns =
        customDeliveryType === "BAT" ? 0 : parsedRuns;

      openWicketPanel(wicketExtraType, wicketExtraRuns);
      return;
    }'''
          if old not in s:
            raise SystemExit('Expected custom delivery wicket block was not found; refusing to modify the file.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-bye-legbye-wickets.yml
          git add src/app/page.tsx
          git commit -m "fix: allow run outs on byes and leg-byes"
          git push origin HEAD:feature/custom-delivery-runs
