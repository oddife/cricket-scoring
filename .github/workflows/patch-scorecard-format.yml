name: Adjust scorecard dismissal formatting

on:
  push:
    branches:
      - wicket-dismissal-2026-08-13

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wicket-dismissal-2026-08-13
          fetch-depth: 1

      - name: Patch scorecard formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/page.tsx')
          text = path.read_text()

          old = '<p className="text-[9px] uppercase text-slate-400">{v.out ? v.d : "not out"}</p>'
          new = '<p className="whitespace-pre text-[9px] text-slate-400">{v.out ? v.d : "NOT OUT"}</p>'
          if old not in text:
              raise SystemExit('Dismissal display marker not found')
          text = text.replace(old, new, 1)

          old = 'case "CAUGHT": return fielder ? `c ${fielder} b ${bowler}` : `c b ${bowler}`;'
          new = 'case "CAUGHT": return fielder ? `c ${fielder}\\u00a0\\u00a0\\u00a0b ${bowler}` : `c b ${bowler}`;'
          if old not in text:
              raise SystemExit('Caught dismissal marker not found')
          text = text.replace(old, new, 1)

          old = 'case "STUMPED": return fielder ? `st ${fielder} b ${bowler}` : `st b ${bowler}`;'
          new = 'case "STUMPED": return fielder ? `st ${fielder}\\u00a0\\u00a0\\u00a0b ${bowler}` : `st b ${bowler}`;'
          if old not in text:
              raise SystemExit('Stumped dismissal marker not found')
          text = text.replace(old, new, 1)

          old = 'case "BOWLED": return `b ${bowler}`;'
          new = 'case "BOWLED": return `b ${bowler}`;'
          if old not in text:
              raise SystemExit('Bowled dismissal marker not found')

          path.write_text(text)
          PY

      - name: Validate
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git rm .github/workflows/patch-scorecard-format.yml
          git commit -m "fix: format scorecard dismissals correctly"
          git push origin wicket-dismissal-2026-08-13
