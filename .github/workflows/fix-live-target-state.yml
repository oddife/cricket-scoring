name: Fix live target state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/fix-live-target-state.py
      - name: Verify build
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: keep target visible after innings transition"
          git rm scripts/fix-live-target-state.py .github/workflows/fix-live-target-state.yml
          git commit -m "chore: remove target patch runner"
          git push
