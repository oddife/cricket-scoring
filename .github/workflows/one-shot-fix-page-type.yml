name: One-shot page type fix

on:
  push:
    branches:
      - feature/custom-delivery-runs

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'oddife'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/custom-delivery-runs
          fetch-depth: 0

      - name: Fix custom delivery wicket type narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text(encoding='utf-8-sig')
          old = '''    if (includeWicket) {\n      openWicketPanel(customDeliveryType, parsedRuns);\n      return;\n    }'''
          new = '''    if (includeWicket) {\n      if (customDeliveryType !== "WIDE" && customDeliveryType !== "NO_BALL") {\n        setError("A wicket with an extra is currently supported for Wide and No Ball.");\n        return;\n      }\n\n      openWicketPanel(customDeliveryType, parsedRuns);\n      return;\n    }'''
          if old not in s:
              raise SystemExit('Expected page.tsx block was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: narrow custom delivery wicket type" || exit 0
          git push origin HEAD:feature/custom-delivery-runs
