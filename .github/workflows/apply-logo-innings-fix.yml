name: Apply logo and innings UI fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        run: python3 .github/logo_and_innings_fix.py
      - name: Verify build
        run: npm ci && npx prisma generate && npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: use real logo and compact innings summary"
          git rm .github/logo_and_innings_fix.py .github/workflows/apply-logo-innings-fix.yml
          git commit -m "chore: remove temporary logo and innings workflow"
          git push
