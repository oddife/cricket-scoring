name: One-time bowler state repair

on: push

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/one_time_bowler_fix.py
      - name: Commit fixes and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-bowler-fix.yml tools/one_time_bowler_fix.py
          git add src/app/page.tsx src/lib/scoring.ts .github/workflows/one-time-bowler-fix.yml tools/one_time_bowler_fix.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: synchronize double-bowler state and display names"
          git push