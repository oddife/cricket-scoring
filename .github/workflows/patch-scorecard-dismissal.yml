name: Patch scorecard dismissal notation

on:
  push:
    branches:
      - wicket-dismissal-2026-08-13

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wicket-dismissal-2026-08-13
          fetch-depth: 1

      - name: Patch scorecard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/page.tsx')
          text = path.read_text()

          old_type = 'wicket: { type: string; dismissedPlayerId: string; bowlerId: string | null } | null;'
          new_type = 'wicket: { type: string; dismissedPlayerId: string; bowlerId: string | null; fielderId: string | null } | null;'
          if old_type not in text:
              raise SystemExit('ScorecardMatch wicket type marker not found')
          text = text.replace(old_type, new_type, 1)

          marker = '              const playerName = (id: string) => match.players.find((item) => item.playerId === id)?.player.name ?? "Player";\n'
          helper = '''              const playerName = (id: string) => match.players.find((item) => item.playerId === id)?.player.name ?? "Player";\n              const dismissalText = (wicket: NonNullable<(typeof match.innings)[number]["deliveries"][number]["wicket"]>) => {\n                const bowler = wicket.bowlerId ? playerName(wicket.bowlerId) : "Bowler";\n                const fielder = wicket.fielderId ? playerName(wicket.fielderId) : "";\n                switch (wicket.type) {\n                  case "BOWLED": return `b ${bowler}`;\n                  case "CAUGHT": return fielder ? `c ${fielder} b ${bowler}` : `c b ${bowler}`;\n                  case "LBW": return `lbw b ${bowler}`;\n                  case "RUN_OUT": return fielder ? `run out (${fielder})` : "run out";\n                  case "STUMPED": return fielder ? `st ${fielder} b ${bowler}` : `st b ${bowler}`;\n                  case "HIT_WICKET": return `hit wicket b ${bowler}`;\n                  case "RETIRED_OUT": return "retired out";\n                  case "RETIRED_HURT": return "retired hurt";\n                  case "OVER_FENCE": return "over fence";\n                  default: return "out";\n                }\n              };\n'''
          if marker not in text:
              raise SystemExit('Scorecard playerName marker not found')
          text = text.replace(marker, helper, 1)

          old_dismissal = 'a.d = x.wicket.type.replaceAll("_", " ");'
          new_dismissal = 'a.d = dismissalText(x.wicket);'
          if old_dismissal not in text:
              raise SystemExit('Scorecard dismissal assignment marker not found')
          text = text.replace(old_dismissal, new_dismissal, 1)

          path.write_text(text)
          PY

      - name: Validate
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git rm .github/workflows/patch-scorecard-dismissal.yml
          git commit -m "fix: show proper cricket dismissal notation in scorecard"
          git push origin wicket-dismissal-2026-08-13
