name: App Logo Feature Build

on:
  push:
    branches:
      - feature/app-logo

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch scorer page
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          page = Path("src/app/page.tsx")
          text = page.read_text(encoding="utf-8")

          if 'import AppLogo from "@/components/AppLogo";' not in text:
              text = text.replace(
                  'import TournamentLogoEditor from "@/components/TournamentLogoEditor";\n',
                  'import TournamentLogoEditor from "@/components/TournamentLogoEditor";\nimport AppLogo from "@/components/AppLogo";\nimport AppLogoEditor from "@/components/AppLogoEditor";\n',
                  1,
              )

          if 'const APP_NAME = "New Castle Cricket Scorer";' not in text:
              text = text.replace(
                  'export default function Home() {',
                  'const APP_NAME = "New Castle Cricket Scorer";\n\nexport default function Home() {',
                  1,
              )

          logo_pattern = re.compile(
              r'<img\s+src="/logo_nobg\.png"\s+alt="Cricket Scorer"\s+className="h-\[135%\] w-\[135%\] object-contain"\s*/>'
          )
          text, logo_count = logo_pattern.subn(
              '<AppLogo alt={APP_NAME} className="h-[135%] w-[135%] object-contain" />',
              text,
          )
          if logo_count != 2 and 'AppLogo alt={APP_NAME} className="h-[135%] w-[135%] object-contain" />' not in text:
              raise SystemExit(f"Expected 2 header logo replacements, found {logo_count}")

          text = text.replace(
              'aria-label="Cricket Scorer - Back to tournaments"',
              'aria-label={`${APP_NAME} - Back to tournaments`}',
          )
          text = text.replace('aria-label="Cricket Scorer"', 'aria-label={APP_NAME}')

          text = text.replace(
              '<span className="truncate text-lg font-bold uppercase tracking-tight sm:text-xl">\n              Cricket Scorer\n            </span>',
              '<span className="truncate text-lg font-bold uppercase tracking-tight sm:text-xl">\n              {APP_NAME}\n            </span>',
          )
          text = text.replace(
              '<span className="block truncate text-2xl font-bold tracking-tight sm:text-3xl">\n              Cricket Scorer\n            </span>',
              '<span className="block truncate text-2xl font-bold tracking-tight sm:text-3xl">\n              {APP_NAME}\n            </span>',
          )
          text = text.replace(
              '<footer className="py-6 text-center text-xs text-slate-600">\n          Cricket Scorer\n        </footer>',
              '<footer className="py-6 text-center text-xs text-slate-600">\n          {APP_NAME}\n        </footer>',
          )

          maintenance_anchor = '              <div className="max-h-[55vh] space-y-3 overflow-y-auto">'
          app_logo_editor = '''              <div className="mb-4">\n                <AppLogoEditor maintenancePin={maintenancePin} />\n              </div>\n\n'''
          if 'AppLogoEditor maintenancePin={maintenancePin}' not in text:
              if maintenance_anchor not in text:
                  raise SystemExit("Maintenance menu anchor not found")
              text = text.replace(maintenance_anchor, app_logo_editor + maintenance_anchor, 1)

          page.write_text(text, encoding="utf-8")
          print(f"Patched page.tsx: {logo_count} header logos replaced")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit feature changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: add server-wide app logo and branding" || true
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/app-logo-build.yml
          git commit -m "chore: remove temporary app logo build workflow"
          git push
