name: Apply odd final over fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: fix odd final over bowler selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source patch
        run: node scripts/fix-odd-final-over.js

      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow single bowler for odd final over"
          git push
