name: Integrate league panel v2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate LeaguePanel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          import_line = 'import { useEffect, useState } from "react";'
          if 'import LeaguePanel from "@/components/LeaguePanel";' not in s:
              s = s.replace(import_line, import_line + '\nimport LeaguePanel from "@/components/LeaguePanel";')
          marker = '        {/* Live Matches */}'
          insertion = '        <LeaguePanel tournamentId={selectedTournament.id} format={selectedTournament.format} />\n\n        {/* Live Matches */}'
          if 'tournamentId={selectedTournament.id} format={selectedTournament.format}' not in s:
              if marker not in s:
                  raise SystemExit('Tournament dashboard marker not found')
              s = s.replace(marker, insertion, 1)
          p.write_text(s)
          PY
      - name: Verify production build
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: integrate league points and awards panel"
          git push origin main
          git rm .github/workflows/integrate-league-panel-v2.yml
          git commit -m "chore: remove league integration workflow"
          git push origin main
