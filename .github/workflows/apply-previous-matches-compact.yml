name: Apply previous matches compact UI

on:
  push:
    branches:
      - fix/previous-matches-compact

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply verified expandable Previous Matches implementation
        shell: python
        env:
          OLD_COMMIT: d7050bf9d0a0cf970b26c4a99e2285715e9783a6
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          path = Path("src/app/page.tsx")
          current = path.read_text(encoding="utf-8")

          if 'const [expandedMatchId, setExpandedMatchId]' in current:
              print("Compact Previous Matches already applied.")
              raise SystemExit(0)

          old_commit = os.environ["OLD_COMMIT"]
          subprocess.run(["git", "fetch", "origin", old_commit], check=True)
          old = subprocess.check_output(
              ["git", "show", f"{old_commit}:src/app/page.tsx"],
              text=True,
              encoding="utf-8",
          )

          old_state_match = re.search(
              r'(?m)^\s*const \[expandedMatchId, setExpandedMatchId\] = useState<string \| null>\(null\);\s*$',
              old,
          )
          if not old_state_match:
              raise SystemExit("Verified old expandable state was not found.")
          old_state = old_state_match.group(0).strip() + "\n"

          start_token = '{completedMatches.map((match) => {'
          start = old.index(start_token)
          end_token = '              );\n            })}'
          end = old.index(end_token, start) + len(end_token)
          old_map = old[start:end]

          if 'expandedMatchId' not in old_map or 'Expand' not in old_map or 'Collapse' not in old_map:
              raise SystemExit("Verified expandable Previous Matches block was not found.")

          # Preserve the current branch's backend/API shape while allowing the
          # verified UI to use the persisted result fields when available.
          type_anchor = '  status: string;\n  createdAt: string;'
          type_replacement = '  status: string;\n  result?: string;\n  winnerId?: string | null;\n  createdAt: string;'
          if type_anchor not in current:
              raise SystemExit("LiveMatchSummary type anchor not found.")
          current = current.replace(type_anchor, type_replacement, 1)

          state_pattern = r'(?m)^(\s*)const \[loadingCompletedMatches, setLoadingCompletedMatches\] = useState\(false\);\s*$'
          state_match = re.search(state_pattern, current)
          if not state_match:
              raise SystemExit("Completed-match state anchor not found.")
          indent = state_match.group(1)
          state_line = f'{indent}const [expandedMatchId, setExpandedMatchId] = useState<string | null>(null);\n'
          current = current[:state_match.end()] + "\n" + state_line.rstrip("\n") + current[state_match.end():]

          current_start = current.index(start_token)
          current_end = current.index(end_token, current_start) + len(end_token)
          current = current[:current_start] + old_map + current[current_end:]

          path.write_text(current, encoding="utf-8")
          print("Applied compact/expand Previous Matches UI.")

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: restore compact expandable previous matches"
          git push origin HEAD:fix/previous-matches-compact
