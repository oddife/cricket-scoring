services:
  cricket-scoring:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cricket-scoring

    ports:
      - "3102:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/data/cricket.db

    volumes:
      - cricket_scoring_data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  cricket_scoring_data:
